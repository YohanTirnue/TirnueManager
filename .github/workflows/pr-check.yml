name: Pull Request Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop

env:
  NODE_VERSION: "20.x"

jobs:
  # Quick build check
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          chmod a+x ./install-dependents.sh
          ./install-dependents.sh

      - name: Lint frontend (if available)
        working-directory: frontend
        run: |
          if npm run | grep -q "lint"; then
            npm run lint || echo "⚠️ Lint warnings found"
          else
            echo "No lint script found - skipping"
          fi
        continue-on-error: true

      - name: Build all components
        run: |
          chmod a+x ./build.sh
          ./build.sh

      - name: Check build output
        run: |
          echo "### ✅ Build Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully for PR #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changes:**" >> $GITHUB_STEP_SUMMARY
          echo "- Files changed: ${{ github.event.pull_request.changed_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- Additions: +${{ github.event.pull_request.additions }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deletions: -${{ github.event.pull_request.deletions }}" >> $GITHUB_STEP_SUMMARY

  # Code quality check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Check for console.log (frontend)
        working-directory: frontend/src
        run: |
          if grep -r "console\.log" . --include="*.ts" --include="*.vue" --include="*.js"; then
            echo "⚠️ Warning: Found console.log statements in frontend code"
            echo "Consider removing them for production"
          else
            echo "✅ No console.log found in frontend"
          fi
        continue-on-error: true

      - name: Check for TODO comments
        run: |
          echo "### 📝 TODO Comments Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -r "TODO" . --include="*.ts" --include="*.vue" --include="*.js" --exclude-dir=node_modules --exclude-dir=dist || echo "No TODO comments found" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # Security check
  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (root)
        run: |
          npm audit --audit-level=high || echo "⚠️ Security vulnerabilities found in root dependencies"
        continue-on-error: true

      - name: Run npm audit (daemon)
        working-directory: daemon
        run: |
          npm install
          npm audit --audit-level=high || echo "⚠️ Security vulnerabilities found in daemon dependencies"
        continue-on-error: true

      - name: Run npm audit (panel)
        working-directory: panel
        run: |
          npm install
          npm audit --audit-level=high || echo "⚠️ Security vulnerabilities found in panel dependencies"
        continue-on-error: true

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level=high || echo "⚠️ Security vulnerabilities found in frontend dependencies"
        continue-on-error: true

  # Summary comment on PR
  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [build-check, code-quality, security-check]
    if: always()

    permissions:
      pull-requests: write

    steps:
      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ needs.build-check.result }}' === 'success' ? '✅' : '❌';
            const qualityStatus = '${{ needs.code-quality.result }}' === 'success' ? '✅' : '⚠️';
            const securityStatus = '${{ needs.security-check.result }}' === 'success' ? '✅' : '⚠️';

            const comment = `## 🤖 Automated PR Check Results

            | Check | Status |
            |-------|--------|
            | Build | ${buildStatus} ${{ needs.build-check.result }} |
            | Code Quality | ${qualityStatus} ${{ needs.code-quality.result }} |
            | Security | ${securityStatus} ${{ needs.security-check.result }} |

            **Build Info:**
            - Commit: \`${{ github.event.pull_request.head.sha }}\`
            - Branch: \`${{ github.event.pull_request.head.ref }}\`
            - Files Changed: ${{ github.event.pull_request.changed_files }}

            ${buildStatus === '✅' ? '✨ All checks passed! Ready for review.' : '⚠️ Some checks failed. Please review the logs.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
