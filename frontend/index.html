    <style>
      #before-app-mounted {
        background: #000000;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
        font-family: "Courier New", Courier, monospace;
        user-select: none;
      }

      #before-app-mounted .loading-box {
        text-align: center;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      /* Cyber Corner Brackets */
      .corner-bracket {
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: rgba(255, 255, 255, 0.6);
        border-style: solid;
        pointer-events: none;
      }
      .top-left { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
      .top-right { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
      .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
      .bottom-right { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

      /* Scanning Light Line */
      .scanline {
        position: absolute;
        top: 0;
        left: -14px;
        right: -14px;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
        box-shadow: 0 0 12px #ffffff;
        animation: scan 2s linear infinite;
        pointer-events: none;
        z-index: 2;
      }

      @keyframes scan {
        0% { top: 0; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      .bit-row {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #ffffff;
        opacity: 0.9;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        animation: glitch-text 0.8s steps(2, start) infinite;
      }

      .glitch-center {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 10px 0;
      }

      .glitch-mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse-glitch 1.2s ease-in-out infinite;
      }

      .glitch-mark svg {
        display: block;
        overflow: visible;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95));
      }

      .glitch-mark .mark path,
      .glitch-mark .mark polygon {
        fill: #ffffff;
      }

      .glitch-mark .mark .outline {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
      }

      .face-digits {
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95));
        animation: digit-glitch 1s steps(1) infinite;
      }

      .particle {
        position: absolute;
        font-size: 13px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.95);
        letter-spacing: 2px;
        pointer-events: none;
      }

      .particle-1 {
        top: 50%;
        left: -54px;
        transform: translateY(-50%);
        animation: float-left 1.5s ease-in-out infinite alternate;
      }

      .particle-2 {
        top: 50%;
        right: -54px;
        transform: translateY(-50%);
        animation: float-right 1.5s ease-in-out infinite alternate;
      }

      @keyframes digit-glitch {
        0%, 100% { opacity: 1; transform: translate(0); }
        33% { opacity: 0.7; transform: translate(-1px, 0.5px); }
        66% { opacity: 0.9; transform: translate(1px, -0.5px); }
      }

      @keyframes glitch-text {
        0% { transform: translate(0); opacity: 0.85; }
        20% { transform: translate(-2px, 1px); opacity: 1; }
        40% { transform: translate(1px, -1px); opacity: 0.65; }
        60% { transform: translate(-1px, -1px); opacity: 0.9; }
        80% { transform: translate(2px, 1px); opacity: 0.75; }
        100% { transform: translate(0); opacity: 0.85; }
      }

      @keyframes pulse-glitch {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5)); }
        50% { transform: scale(0.96) skewX(-2deg); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95)); }
      }

      @keyframes float-left {
        0% { transform: translateY(-50%) translateX(0); opacity: 0.4; }
        100% { transform: translateY(-50%) translateX(-5px); opacity: 1; }
      }

      @keyframes float-right {
        0% { transform: translateY(-50%) translateX(0); opacity: 0.4; }
        100% { transform: translateY(-50%) translateX(5px); opacity: 1; }
      }
    </style>

    <script>
      (function() {
        const faceSeq = ["00", "01", "10", "11"];
        let faceStep = 0;

        let bitTimer = setInterval(() => {
          const top = document.getElementById("index-bit-top");
          const bot = document.getElementById("index-bit-bot");
          const p1 = document.getElementById("index-bit-p1");
          const p2 = document.getElementById("index-bit-p2");
          const faceEl = document.getElementById("index-face-digits");
          if (!top || !bot) return;
          let b1 = "", b2 = "";
          for (let i = 0; i < 8; i++) {
            b1 += Math.random() > 0.5 ? "1" : "0";
            b2 += Math.random() > 0.5 ? "1" : "0";
          }
          top.textContent = b1;
          bot.textContent = b2;
          if (p1) p1.textContent = b1.slice(0, 4);
          if (p2) p2.textContent = b2.slice(0, 4);

          faceStep++;
          if (faceStep % 3 === 0 && faceEl) {
            faceEl.textContent = faceSeq[Math.floor(faceStep / 3) % faceSeq.length];
          }
        }, 85);
        window.__bitTimer = bitTimer;
      })();

      window.closeLoadingContainer = function () {
        if (window.__bitTimer) clearInterval(window.__bitTimer);
        const loadingContainer = document.getElementById("before-app-mounted");
        if (loadingContainer) {
          loadingContainer.style.opacity = "0";
          setTimeout(() => {
            loadingContainer.style.display = "none";
          }, 500);
        }
      };
    </script>
