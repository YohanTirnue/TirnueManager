    <style>
      #before-app-mounted {
        background: #0a0a0a;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #before-app-mounted .loading-box {
        text-align: center;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }

      .orbital-loader {
        position: relative;
        width: 150px;
        height: 150px;
        margin-bottom: 30px;
      }

      .orbit-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        border: 3px solid transparent;
        transform: translate(-50%, -50%);
      }

      .ring-outer {
        width: 140px;
        height: 140px;
        border-top-color: rgba(255, 165, 0, 0.8);
        border-right-color: rgba(255, 215, 0, 0.6);
        animation: rotate-ring 2.5s linear infinite;
      }

      .ring-middle {
        width: 110px;
        height: 110px;
        border-top-color: rgba(255, 215, 0, 0.8);
        border-left-color: rgba(255, 165, 0, 0.6);
        animation: rotate-ring 2s linear infinite reverse;
      }

      .ring-inner {
        width: 80px;
        height: 80px;
        border-top-color: rgba(255, 165, 0, 0.7);
        border-right-color: rgba(255, 215, 0, 0.5);
        animation: rotate-ring 1.5s linear infinite;
      }

      @keyframes rotate-ring {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .logo-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        animation: logo-pulse 2s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(255, 165, 0, 0.8));
      }

      @keyframes logo-pulse {
        0%, 100% {
          transform: translate(-50%, -50%) scale(1);
          filter: drop-shadow(0 0 12px rgba(255, 165, 0, 0.8));
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1));
        }
      }

      .loading-text {
        color: #FFA500;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 2px;
        animation: text-fade 2s ease-in-out infinite;
      }

      @keyframes text-fade {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .logo-center.animating {
        animation: none !important;
      }
    </style>

    <script>
      window.closeLoadingContainer = function () {
        const loadingContainer = document.getElementById("before-app-mounted");
        const logoElement = document.querySelector(".logo-center");
        const loadingText = document.querySelector(".loading-text");
        const orbitalLoader = document.querySelector(".orbital-loader");

        // Fade out rings and text
        if (orbitalLoader) {
          orbitalLoader.querySelectorAll(".orbit-ring").forEach(ring => {
            ring.style.transition = "opacity 0.4s ease-out";
            ring.style.opacity = "0";
          });
        }
        if (loadingText) {
          loadingText.style.transition = "opacity 0.4s ease-out";
          loadingText.style.opacity = "0";
        }

        // After fade, prepare for logo animation
        setTimeout(() => {
          // Make background transparent but keep logo visible
          loadingContainer.style.background = "transparent";
          loadingContainer.style.pointerEvents = "none";

          if (logoElement) {
            // Stop the pulsing animation
            logoElement.classList.add("animating");
            logoElement.style.animation = "none";
            logoElement.style.filter = "drop-shadow(0 0 12px rgba(255, 165, 0, 0.8))";

            // Get current viewport dimensions
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            // Current center position (in viewport coordinates)
            const currentX = vw * 0.5;
            const currentY = vh * 0.5;

            // Target center position
            const targetX = vw * 0.25;
            const targetY = vh * 0.35;

            // Calculate the translation needed
            const deltaX = targetX - currentX;
            const deltaY = targetY - currentY;

            // Convert logo to fixed positioning
            logoElement.style.position = "fixed";
            logoElement.style.top = "50%";
            logoElement.style.left = "50%";
            logoElement.style.margin = "0";
            logoElement.style.zIndex = "10000";
            logoElement.style.transform = "translate(-50%, -50%)";

            // Force reflow
            logoElement.offsetHeight;

            // Animate to target position
            setTimeout(() => {
              logoElement.style.transition = "transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), width 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), height 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.7s ease-out";
              logoElement.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
              logoElement.style.width = "120px";
              logoElement.style.height = "120px";
              logoElement.style.filter = "drop-shadow(0 10px 30px rgba(255, 140, 66, 0.4))";
            }, 30);

            // Signal login page after logo starts moving
            setTimeout(() => {
              window.loginAnimationReady = true;
              window.dispatchEvent(new Event("login-animation-start"));
            }, 100);

            // Fade out loading logo smoothly AFTER login logo is in place
            setTimeout(() => {
              logoElement.style.transition = "opacity 0.4s ease-out";
              logoElement.style.opacity = "0";
            }, 700);
          }

          // Remove loading container after all animations complete
          setTimeout(() => {
            loadingContainer.style.display = "none";
          }, 1500);
        }, 400);
      };
    </script>
