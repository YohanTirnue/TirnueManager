<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Tirnue</title>

    <style>
      #before-app-mounted {
        background: #0a0a0a;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #before-app-mounted .loading-box {
        text-align: center;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }

      .orbital-loader {
        position: relative;
        width: 150px;
        height: 150px;
        margin-bottom: 30px;
      }

      .orbit-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        border: 3px solid transparent;
        transform: translate(-50%, -50%);
      }

      .ring-outer {
        width: 140px;
        height: 140px;
        border-top-color: rgba(255, 165, 0, 0.8);
        border-right-color: rgba(255, 215, 0, 0.6);
        animation: rotate-ring 2.5s linear infinite;
      }

      .ring-middle {
        width: 110px;
        height: 110px;
        border-top-color: rgba(255, 215, 0, 0.8);
        border-left-color: rgba(255, 165, 0, 0.6);
        animation: rotate-ring 2s linear infinite reverse;
      }

      .ring-inner {
        width: 80px;
        height: 80px;
        border-top-color: rgba(255, 165, 0, 0.7);
        border-right-color: rgba(255, 215, 0, 0.5);
        animation: rotate-ring 1.5s linear infinite;
      }

      @keyframes rotate-ring {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .logo-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        animation: logo-pulse 2s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(255, 165, 0, 0.8));
      }

      @keyframes logo-pulse {
        0%, 100% {
          transform: translate(-50%, -50%) scale(1);
          filter: drop-shadow(0 0 12px rgba(255, 165, 0, 0.8));
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1));
        }
      }

      .loading-text {
        color: #FFA500;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 2px;
        animation: text-fade 2s ease-in-out infinite;
      }

      @keyframes text-fade {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>

    <script>
      window.closeLoadingContainer = function () {
        const loadingContainer = document.getElementById("before-app-mounted");
        const logoElement = document.querySelector(".logo-center");
        const loadingText = document.querySelector(".loading-text");
        const orbitalLoader = document.querySelector(".orbital-loader");

        // Fade out rings and text
        if (orbitalLoader) {
          orbitalLoader.querySelectorAll(".orbit-ring").forEach(ring => {
            ring.style.transition = "opacity 0.5s ease";
            ring.style.opacity = "0";
          });
        }
        if (loadingText) {
          loadingText.style.transition = "opacity 0.5s ease";
          loadingText.style.opacity = "0";
        }

        // Mark logo for animation to login page
        if (logoElement) {
          logoElement.classList.add("animating-to-login");
        }

        // After fade, hide loading container but keep logo visible
        setTimeout(() => {
          loadingContainer.style.background = "transparent";
          loadingContainer.style.pointerEvents = "none";

          // Signal to login page that animation is ready
          window.loginAnimationReady = true;
          window.dispatchEvent(new Event("login-animation-start"));

          // Remove loading container after animation completes
          setTimeout(() => {
            loadingContainer.style.display = "none";
          }, 1500);
        }, 500);
      };
    </script>
  </head>
  <body>
    <div id="before-app-mounted">
      <noscript>You need to enable JavaScript to run this Website.</noscript>
      <div class="loading-box">
        <div class="orbital-loader">
          <div class="orbit-ring ring-outer"></div>
          <div class="orbit-ring ring-middle"></div>
          <div class="orbit-ring ring-inner"></div>
          <img src="/favicon.png" alt="Loading" class="logo-center">
        </div>
        <div class="loading-text">LOADING</div>
      </div>
    </div>
    <div id="app-mount-point" style="width: 100vw"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
