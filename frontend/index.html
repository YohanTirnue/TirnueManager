<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Tirnue</title>

    <style>
      #before-app-mounted {
        background: #0a0a0a;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #before-app-mounted .loading-box {
        text-align: center;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }

      .orbital-loader {
        position: relative;
        width: 150px;
        height: 150px;
        margin-bottom: 30px;
      }

      .orbit-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        border: 3px solid transparent;
        transform: translate(-50%, -50%);
      }

      .ring-outer {
        width: 140px;
        height: 140px;
        border-top-color: rgba(255, 165, 0, 0.8);
        border-right-color: rgba(255, 215, 0, 0.6);
        animation: rotate-ring 2.5s linear infinite;
      }

      .ring-middle {
        width: 110px;
        height: 110px;
        border-top-color: rgba(255, 215, 0, 0.8);
        border-left-color: rgba(255, 165, 0, 0.6);
        animation: rotate-ring 2s linear infinite reverse;
      }

      .ring-inner {
        width: 80px;
        height: 80px;
        border-top-color: rgba(255, 165, 0, 0.7);
        border-right-color: rgba(255, 215, 0, 0.5);
        animation: rotate-ring 1.5s linear infinite;
      }

      @keyframes rotate-ring {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .logo-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        animation: logo-pulse 2s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(255, 165, 0, 0.8));
      }

      @keyframes logo-pulse {
        0%, 100% {
          transform: translate(-50%, -50%) scale(1);
          filter: drop-shadow(0 0 12px rgba(255, 165, 0, 0.8));
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1));
        }
      }

      .loading-text {
        color: #FFA500;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 2px;
        animation: text-fade 2s ease-in-out infinite;
      }

      @keyframes text-fade {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .logo-center.animating {
        animation: none !important;
      }
    </style>

    <script>
      window.closeLoadingContainer = function () {
        const loadingContainer = document.getElementById("before-app-mounted");
        const logoElement = document.querySelector(".logo-center");
        const loadingText = document.querySelector(".loading-text");
        const orbitalLoader = document.querySelector(".orbital-loader");

        // Fade out rings and text
        if (orbitalLoader) {
          orbitalLoader.querySelectorAll(".orbit-ring").forEach(ring => {
            ring.style.transition = "opacity 0.5s ease";
            ring.style.opacity = "0";
          });
        }
        if (loadingText) {
          loadingText.style.transition = "opacity 0.5s ease";
          loadingText.style.opacity = "0";
        }

        // After fade, prepare for logo animation
        setTimeout(() => {
          // Make background transparent but keep logo visible
          loadingContainer.style.background = "transparent";
          loadingContainer.style.pointerEvents = "none";

          if (logoElement) {
            // Stop the pulsing animation
            logoElement.classList.add("animating");
            logoElement.style.animation = "none";
            logoElement.style.filter = "drop-shadow(0 0 12px rgba(255, 165, 0, 0.8))";

            // Make logo fixed position so it can move freely
            const rect = logoElement.getBoundingClientRect();
            logoElement.style.position = "fixed";
            logoElement.style.top = rect.top + "px";
            logoElement.style.left = rect.left + "px";
            logoElement.style.transform = "translate(-50%, -50%)";
            logoElement.style.margin = "0";
            logoElement.style.zIndex = "10000";

            // Calculate target position (left side of screen, centered vertically)
            // Accounting for the login container layout
            const targetX = window.innerWidth * 0.25; // 25% from left (middle of left section)
            const targetY = window.innerHeight * 0.35; // 35% from top

            // Animate to target position
            setTimeout(() => {
              logoElement.style.transition = "all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)";
              logoElement.style.top = targetY + "px";
              logoElement.style.left = targetX + "px";
              logoElement.style.width = "120px";
              logoElement.style.height = "120px";
              logoElement.style.filter = "drop-shadow(0 10px 30px rgba(255, 140, 66, 0.4))";
            }, 50);

            // Signal login page to show content at the right time
            setTimeout(() => {
              window.loginAnimationReady = true;
              window.dispatchEvent(new Event("login-animation-start"));
            }, 200);

            // Hide loading logo and show login logo after animation completes
            setTimeout(() => {
              logoElement.style.opacity = "0";
              logoElement.style.transition = "opacity 0.3s ease";
            }, 850);
          }

          // Remove loading container after all animations complete
          setTimeout(() => {
            loadingContainer.style.display = "none";
          }, 2000);
        }, 500);
      };
    </script>
  </head>
  <body>
    <div id="before-app-mounted">
      <noscript>You need to enable JavaScript to run this Website.</noscript>
      <div class="loading-box">
        <div class="orbital-loader">
          <div class="orbit-ring ring-outer"></div>
          <div class="orbit-ring ring-middle"></div>
          <div class="orbit-ring ring-inner"></div>
          <img src="/favicon.png" alt="Loading" class="logo-center">
        </div>
        <div class="loading-text">LOADING</div>
      </div>
    </div>
    <div id="app-mount-point" style="width: 100vw"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
